<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} - MegaSave</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#0d0d12; color:#f2f2f5; }
  header { padding:18px 20px; border-bottom:1px solid #2a2a38; }
  .logo { font-size:24px; font-weight:800; } .logo span { color:#ff5138; }
  main { max-width:820px; margin:0 auto; padding:28px 18px 60px; line-height:1.7; }
  h1 { font-size:28px; } h2 { font-size:19px; margin-top:28px; }
  p, li { color:#c9c9d4; }
  a { color:#ff8a7a; }
  footer { border-top:1px solid #2a2a38; padding:20px; text-align:center; color:#a7a7b5; font-size:14px; }
  footer a { color:#a7a7b5; margin:0 10px; }
</style>
</head>
<body>
<header><div class="logo">Mega<span>Save</span></div></header>
<main>
{% block body %}{% endblock %}
</main>
<footer>
  <a href="/">Home</a> &middot; <a href="/privacy">Privacy Policy</a> &middot;
  <a href="/terms">Terms of Use</a> &middot; <a href="/dmca">Copyright / DMCA</a>
</footer>
</body>
</html>
